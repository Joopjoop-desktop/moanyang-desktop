# 맥 체험 빌드 (설계 3.2)
# 맥 앱은 맥에서만 빌드되므로 GitHub의 맥 서버에서 만든다.
# 비공개 저장소는 맥 서버 사용 시간이 빨리 줄어서 버튼을 누를 때만 돌린다.
name: Build Mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac:
    # macos-latest는 M칩(arm64) 서버. better-sqlite3도 여기서 arm64용으로 컴파일된다
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall(install-app-deps)에서 better-sqlite3를 Electron에 맞게 다시 컴파일한다
      - run: npm ci

      # 테스트는 PR 전에 Windows에서 돌리므로 여기서는 빌드만 한다(맥 서버 시간 절약).
      # build:mac 안의 npm run build가 타입 검사를 한다.
      # --publish never: CI에서 electron-builder가 GitHub 릴리스로 올리려 하지 않게 한다
      - run: npm run build:mac -- --publish never

      # 패키징된 앱 안의 Electron으로 better-sqlite3를 불러와 DB를 열어 본다.
      # electron-builder.yml에서 다른 OS용 prebuild를 빼므로, 맥용이 제대로 들어갔는지 여기서 확인한다.
      - name: Check packaged app
        env:
          APP: dist/mac-arm64/Joopjoop.app
        run: |
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/Joopjoop" -e "
            const Database = require(process.argv[1])
            const db = new Database(':memory:')
            console.log('sqlite', db.prepare('select sqlite_version() v').get().v)
          " "$PWD/$APP/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3"
          ls "$APP/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3/prebuilds"
          find "$APP" -name '*.lproj' -maxdepth 6
          du -sh "$APP" dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: joopjoop-mac-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
