appId: com.joopjoop.desktop
productName: Joopjoop
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!scripts/**'
  # 개발용 DB와 마이그레이션 원본은 asar에 넣지 않는다 (마이그레이션은 extraResources로 별도 포함)
  - '!data/**'
  - '!drizzle/**'
  - '!{electron.vite,vitest,drizzle}.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.editorconfig,.nvmrc,CHANGELOG.md,README.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# 마이그레이션 SQL은 asar 밖 resources/drizzle/에 둔다 (설계 3.1)
extraResources:
  - from: drizzle
    to: drizzle
    filter:
      - '**/*'
asarUnpack:
  - resources/**
win:
  executableName: joopjoop
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# 맥은 체험용 빌드만: dmg 하나, M칩(arm64)만 (설계 3.2)
mac:
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.productivity
  # 서명·공증은 정식 배포 때. M칩은 서명 없는 앱을 실행하지 않으므로 임시 서명(ad-hoc)만 한다.
  # 임시 서명에 hardenedRuntime을 켜면 Electron 프레임워크 서명과 맞지 않아 앱이 안 열린다.
  identity: '-'
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
